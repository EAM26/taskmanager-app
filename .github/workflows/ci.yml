name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_test_password

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskmanager
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d taskmanager"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and test with Maven
        run: bash ./mvnw -B clean verify